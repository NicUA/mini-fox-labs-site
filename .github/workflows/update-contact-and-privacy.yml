name: Update site contact and privacy

on:
  push:
    paths:
      - '.github/workflows/update-contact-and-privacy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply replacements
        run: bash update-site.sh
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' script.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update support email and site URLs"
            git push
          fi
